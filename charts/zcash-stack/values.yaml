# Default values for the zcash-stack chart.

global:
  # Pre-created pull secret(s) for private registries, merged into every pod.
  imagePullSecrets: []
  #  - regcred

  # Set volume ownership via fsGroup instead of a root chown init container.
  # tor is excluded (its hidden-service dir must be mode 0700, which fsGroup can't set).
  fsGroup:
    enabled: true
  images:
    busybox:
      tag: latest
      hash: 4be429a5fbb2e71ae7958bfa558bc637cf3a61baf40a708cb8fff532b39e52d0
    alpine:
      tag: latest
      hash: c5b1261d6d3e43071626931fc004f70149baeba2c8ec672bd4f27761f8e1ad6b
    # Used by zebra.p2pPublic externalAddrFrom: nodeExternalIP.
    kubectl:
      repository: rancher/kubectl
      tag: v1.31.1
    # Used by the snapshot init container only for gs:// URLs (gsutil streaming).
    cloudSdk:
      repository: gcr.io/google.com/cloudsdktool/cloud-sdk
      tag: slim
      hash: f6f0c385dbadb0f28e6632efca3139b70d52192399540d3f7c28c530cdef8964

# Optionally have the chart create the registry pull secret. Use an access token.
imageCredentials:
  enabled: false
  name: regcred
  registry: https://index.docker.io/v1/
  username: ""
  password: ""
  email: ""

# RPC credentials for lightwalletd / zaino / explorer to reach the backend node.
rpc:
  credentials:
    rpcUser: 100ZECS
    rpcPassword: h3hqw3eRHcoqwirhOCQWHEr2OC

zebra:
  enabled: false
  name: zebra
  testnet: false
  image:
    repository: zfnd/zebra
    tag: 6.2.3
    hash: bb2a6029db277ee3a10e951dcc0ddd36b4cbcbe0fad684746d695ee21d53fde2
    pullPolicy: IfNotPresent

  # Each replica is a full node with its own PVC. Scale for redundancy, not load.
  replicas: 1
  podManagementPolicy: Parallel
  minReadySeconds: 30
  pdb:
    minAvailable: 1
  topologySpread:
    enabled: true
    whenUnsatisfiable: ScheduleAnyway

  initSnapshot:
    # Restore chain state from a snapshot tar. URL scheme picks the downloader:
    # gs:// uses gsutil (cloud-sdk image), https:// uses wget (alpine). The tar must
    # have a single top-level dir (extracted with --strip-components=1).
    enabled: false
    url: https://link.storjshare.io/s/jvsl24cnnc6o5xhd2zqn5svvuwda/snapshots/zebra/zebra-2026-06-03.tar?download=1
    # Testnet equivalent (set testnet: true and swap url to this). Same shape as the
    # mainnet tar: plain tar, one top-level dir, so the defaults below apply as-is.
    # https://link.storjshare.io/s/jvxtmwlbmthdpebml2urx4li3w7q/nodedumps/zec/zebra-testnet-2026-07-02.tar?download=1
    # A pre-existing, unmarked volume is normally adopted as-is. Set false to wipe and
    # restore it instead, for when the on-disk data is unusable by the running image.
    adoptExisting: true
    # Optional, for snapshots that need more than plain-tar streaming. Unset = old
    # behaviour (stream wget|tar, strip 1). See the zakura block for what these do.
    compression: ""
    stripComponents: 1
    resumable: false
    sha256: ""

  additionalEnv: {}

  # Accept inbound P2P via hostPort (one replica per node; not on GKE Autopilot).
  p2pPublic:
    enabled: false
    # hostIP | nodeExternalIP | loadBalancer (see README).
    externalAddrFrom: hostIP
    # Required when externalAddrFrom: loadBalancer.
    externalIP: ""

  # Initial peers for zebra's peerset. Rendered to initial_{mainnet,testnet}_peers per
  # the active network. NOTE: this REPLACES zebra's default DNS seeders, it does not add
  # to them - include the seeders in the list if you still want them. Empty = use zebra's
  # built-in defaults. host:port strings, e.g. "1.2.3.4:8233".
  initialPeers: []

  # "" uses the cluster default StorageClass. Immutable on an existing StatefulSet.
  storageClassName: ""
  volumes:
    data:
      size: 500Gi

  service:
    type: ClusterIP
    # Pin each lightwalletd to one replica's chain state (None = round-robin).
    sessionAffinity: ClientIP
    # Keep zebra in the Service even when not-ready. testnet-only escape hatch for
    # sync-gate flap that can deadlock lwd init-rpc. Leave false in prod.
    publishNotReadyAddresses: false

  # CPU request kept at 350m to satisfy Autopilot's mem:CPU ratio at 2Gi mem.
  # CPU limit omitted so zebra can burst during sync.
  resources:
    requests:
      cpu: 350m
      memory: 2Gi
    limits:
      memory: 8Gi

  # zebra serves /ready and /healthy on :8081.
  probes:
    startup:
      # Long budget so liveness can't kill a node during initial sync.
      enabled: true
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 240
    readiness:
      enabled: true
      # zebrad /ready returns 200 on testnet unless this is set; keep true so the
      # gate also applies on testnet. No effect when testnet=false.
      enforceOnTestnet: true
      # zebrad ready_max_blocks_behind. Unset = zebrad's own default (2), which is
      # tight for testnet: blocks arrive in bursts, so /ready can flap, and lwd
      # (which Fatals on an RPC error) dies when all replicas dip at once.
      maxBlocksBehind: ""
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
    liveness:
      enabled: true
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3
      successThreshold: 1

# Zakura is a zebra fork, so it is a drop-in backend for lightwalletd/zaino, not a
# zaino replacement. Point lightwalletd.rpcService / zaino.rpcService at it by name.
zakura:
  enabled: false
  name: zakura
  testnet: false
  image:
    # 1.1.0 keeps state format 28.0.3, so it reopens a 1.0.4 cache in place.
    # Config schema is unchanged; ZakuradConfig is deny_unknown_fields, so check
    # that before bumping. Also ships zakura-prune-state / zakura-rollback-state.
    repository: zakuracore/zakura
    tag: 1.1.0
    hash: b4705205fd070114e0b509f0d659562ac18f547213f86598adf7acb6efc97ad2
    pullPolicy: IfNotPresent

  # Each replica is a full node with its own PVC. Scale for redundancy, not load.
  replicas: 1
  podManagementPolicy: Parallel
  minReadySeconds: 30
  pdb:
    minAvailable: 1
  topologySpread:
    enabled: true
    whenUnsatisfiable: ScheduleAnyway

  # archive keeps every tx body; pruned drops them outside txRetention blocks and is
  # ONE-WAY (a pruned db can't be reopened as archive). Must match the snapshot family.
  storageMode: archive
  txRetention: 10000

  initSnapshot:
    # zakura's tars are zstd and rooted at state/, hence compression + stripComponents 0.
    enabled: false
    url: https://zakura.valargroup.dev/mainnet/zakura-mainnet-20260727T140819Z-3426994.tar.zst
    compression: zstd
    stripComponents: 0
    # aria2c to a scratch file instead of streaming. Streaming cannot resume, and the
    # ~250Gi archive reliably drops its connection partway, which wipes and restarts
    # the whole transfer. Costs disk: size the volume for archive PLUS extracted data.
    resumable: true
    # Verified by aria2 after download. From the snapshots.json entry for this url.
    sha256: bb121a02b8fdcca5d4ae1009ffcfc0401b02dddd361c00b3041b6b6616e0cbe4
    adoptExisting: true

  # Experimental iroh/QUIC P2P v2 on UDP 8234 (same port on both networks). zakura
  # ships it off on mainnet, dual on testnet; the chart pins it so the network can't
  # decide for us. Off here, on in deploy/.
  p2pV2:
    enabled: false
    # dual keeps the legacy TCP stack up alongside v2. NOTE: mode zakura is v2-only and
    # /healthy + /ready read the LEGACY address book, so k8s probes never pass.
    mode: dual
    # Container AND host port. zakura advertises the v2 endpoint as external_addr's IP
    # plus this port, so the two must match; change it when another node on the same
    # host already holds 8234.
    listenPort: 8234
    # nodeid@host:8234. Empty uses zakura's per-network defaults. Cannot be set by env
    # var (zakura's env source has no list separator), so it has to live in the config.
    bootstrapPeers: []
    maxConnections: 256
    maxConnectionsPerIp: 16

  additionalEnv: {}

  # Accept inbound P2P via hostPort (one replica per node; not on GKE Autopilot).
  # Opens the v2 UDP port too when p2pV2 is enabled.
  p2pPublic:
    enabled: false
    # hostIP | nodeExternalIP | loadBalancer (see README).
    externalAddrFrom: hostIP
    # Required when externalAddrFrom: loadBalancer.
    externalIP: ""
    # "" uses the network's default P2P port. Override when a zebra (or another zakura)
    # on the same node already holds it: a hostPort collision leaves the pod Pending.
    # The advertised external_addr follows this, so inbound peers still reach us.
    hostPort: ""

  # REPLACES zakura's default DNS seeders, does not add to them. host:port strings.
  initialPeers: []

  # Pin to a node when the StorageClass is node-bound (k3s local-path) and only some
  # nodes have room for an archive state dir.
  nodeSelector: {}

  # "" uses the cluster default StorageClass. Immutable on an existing StatefulSet.
  storageClassName: ""
  volumes:
    data:
      size: 600Gi

  service:
    type: ClusterIP
    # Pin each lightwalletd to one replica's chain state (None = round-robin).
    sessionAffinity: ClientIP
    publishNotReadyAddresses: false

  resources:
    requests:
      cpu: 350m
      memory: 2Gi
    limits:
      memory: 8Gi

  # zakura serves /ready and /healthy on :8081. NOTE: the health server is disabled
  # unless [health] listen_addr is set, which the chart always renders.
  probes:
    startup:
      enabled: true
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 240
    readiness:
      enabled: true
      # /ready returns 200 on testnet unless this is set; keep true so the gate also
      # applies on testnet. No effect when testnet=false.
      enforceOnTestnet: true
      # zakura's own default is 2, which is tight for testnet: blocks arrive in bursts
      # so /ready flaps, and lwd Fatals on an RPC error when all replicas dip at once.
      maxBlocksBehind: ""
      # zakura refuses to report healthy below this many legacy peers.
      minConnectedPeers: 1
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
    liveness:
      enabled: true
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3
      successThreshold: 1

lightwalletd:
  enabled: true
  name: lightwalletd
  # Name of the backend RPC Service to use.
  rpcService: zebra
  donationAddress:
  image:
    # Stock upstream lightwalletd. Block ingest is serial, so building a cache from
    # scratch is slow; seed it with initSnapshot below instead.
    # v0.5.1 detects a zakura backend, so it works against zakura as well as
    # zebrad and zcashd. Same cache start height as v0.5.0, so no re-index.
    # v0.5.3 fixes GHSA-m7j5-wvx3-qj6j: GetBlockRange / GetBlockRangeNullifiers could
    # return a block from an abandoned fork next to one from the current fork while the
    # ingestor repaired a reorg. They now fail Aborted instead of serving that pair.
    # EDGE CONTRACT: this backend must answer non-gRPC `OPTIONS /` with 415 and
    # /healthz with 200/503 (the Fly HAProxy edge health-checks `expect 415`).
    # Don't add a website / change the 415 response here while an HAProxy edge checks it.
    repository: electriccoinco/lightwalletd
    tag: v0.5.3
    hash: 123a165ae7f2707231b909c4e24f3173a9516eb0c9906f9517cddb4bf4e73fb1
    pullPolicy: IfNotPresent

  # Parallel ingestor tuning (env vars). Empty = binary defaults (workers=8, window=64).
  # Raise workers on big backends (e.g. 24 on the 64-core boxes).
  ingest:
    workers:   # e.g. 24
    window:    # e.g. 128
  # Extra env vars for the container (list of {name,value}).
  extraEnv: []

  # Set replicas to 2+ for zero-downtime rolling updates (each gets its own cache
  # PVC; the PDB keeps one available; the ingress load-balances gRPC across pods).
  replicas: 1
  podManagementPolicy: Parallel
  minReadySeconds: 15
  pdb:
    minAvailable: 1
  topologySpread:
    enabled: true
    whenUnsatisfiable: ScheduleAnyway

  initSnapshot:
    enabled: false
    url: https://link.storjshare.io/s/jvfegr7l7gwgcsvdml5lazlnypdq/nodedumps/zec/lwd/2024-03-26.tar?download=1
    # See zebra.initSnapshot.adoptExisting. Set false to replace a cache the running
    # image cannot read, e.g. one written with a different cache start height.
    adoptExisting: true
  additionalArgs: []

  storageClassName: ""
  volumes:
    data:
      size: 40Gi

  service:
    type: ClusterIP
    port: 9067

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 3Gi

  # Defaults to a TCP check on the gRPC port. Set type: grpc once the build exposes
  # grpc.health.v1, or type: exec for a GetLightdInfo check (needs grpcurl in image).
  probes:
    startup:
      enabled: true
      type: tcpSocket          # tcpSocket | grpc
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 60
    readiness:
      enabled: true
      type: tcpSocket          # tcpSocket | grpc | exec
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
    liveness:
      enabled: true
      type: tcpSocket          # tcpSocket | grpc
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1

  # TLS + host routing via Ingress. All hosts route to this one Service.
  ingress:
    enabled: true
    className: nginx
    hosts:
      - lwd.example.com
      # No DNS yet? A sslip.io name (e.g. 203-0-113-7.sslip.io) lets HTTP-01 validate
      # before branded DNS exists. See README.
    path: /
    pathType: Prefix
    # On Traefik, GRPC makes the chart emit a Traefik IngressRoute (h2c) + Certificate.
    backendProtocol: GRPC
    annotations: {}
    tls:
      enabled: true
      # cert-manager: leave secretName empty and set clusterIssuer.
      clusterIssuer: letsencrypt-prod
      # bring-your-own: set secretName to a pre-created tls Secret (clusterIssuer ignored).
      secretName: ""
      # Turn off only if a cert-manager HTTP-01 challenge fails on first issuance.
      sslRedirect: "true"

explorer:
  enabled: false
  name: explorer
  # JSON-RPC backend for the explorer image. Empty = the zebra Service and its port.
  # The image's env vars are still named ZCASHD_*; that is the image's contract, not
  # a zcashd dependency. Zaino serves gRPC only, so it cannot back this image as-is.
  backend:
    host: ""
    port: ""
  replicas: 1
  topologySpread:
    enabled: true
    whenUnsatisfiable: ScheduleAnyway
  image:
    repository: emersonian/zcash-explorer
    tag: v0.0.6
    hash: ff583282563a566c09d004cd4bdf2f30edd32497a3a98eec40df1da130a69df9
    pullPolicy: IfNotPresent
  hostname: ""
  service:
    type: ClusterIP
    port: 4000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 3072Mi
  probes:
    startup:
      enabled: true
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 30
    readiness:
      enabled: true
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
    liveness:
      enabled: true
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
  env:
    # NOTE: Override this if you want cookies to store sensitive information.
    # Generate it with Elixir and Phoenix installed: "mix phx.gen.secret"
    SECRET_KEY_BASE: 552Ean5DQvRgWpbO/xR4HADdPkNz30mKICmkzuqWUvp+2e1NZderMWVA/v6KkcfJ
    EXPLORER_SCHEME: https
    EXPLORER_PORT: "4000"
    ZCASH_NETWORK: mainnet
    zcash_network: mainnet
  ingress:
    enabled: false
    className: nginx
    hosts:
      - explorer.example.com
    path: /
    pathType: Prefix
    backendProtocol: HTTP
    annotations: {}
    tls:
      enabled: true
      clusterIssuer: letsencrypt-prod
      secretName: ""
      sslRedirect: "true"

zaino:
  enabled: false
  name: zaino
  rpcService: zebra
  image:
    # The `-no-tls` variant, which the chart's plaintext gRPC wiring needs.
    # 0.7.0's breaking changes are crate-level (zaino-proto, zaino-state); the
    # zainod.toml schema is unchanged from 0.6.0.
    repository: zingodevops/zaino
    tag: 0.7.0-no-tls
    hash: b160021e6ea7ee0e664b3ac577433a776f1c96550439d0c0fccf5df20fcfb49d
    pullPolicy: IfNotPresent

  replicas: 1
  podManagementPolicy: Parallel
  minReadySeconds: 15
  pdb:
    minAvailable: 1
  topologySpread:
    enabled: true
    whenUnsatisfiable: ScheduleAnyway

  storageClassName: ""
  volumes:
    data:
      size: 40Gi

  service:
    type: ClusterIP
    port: 8137

  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 6Gi

  probes:
    startup:
      enabled: true
      type: tcpSocket          # tcpSocket | grpc
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 60
    readiness:
      enabled: true
      type: tcpSocket          # tcpSocket | grpc
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
    liveness:
      enabled: true
      type: tcpSocket          # tcpSocket | grpc
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 5
      successThreshold: 1

  additionalArgs: []
  config:
    dbSize: 128            # [storage.database] size: LMDB map cap in GiB
    service:
      timeout: 30
      channelSize: 32
    cache:
      capacity: 10000
      shardPower: 4

  ingress:
    enabled: true
    className: nginx
    hosts:
      - zaino.example.com
    path: /
    pathType: Prefix
    backendProtocol: GRPC
    annotations: {}
    tls:
      enabled: true
      clusterIssuer: letsencrypt-prod
      secretName: ""
      sslRedirect: "true"

# Optional hidden service exposing lightwalletd/zaino over .onion. tor keeps a root
# chown/chmod init container (hidden-service dir must be 0700) and skips fsGroup.
tor:
  enabled: false
  name: tor
  targetService: zaino
  hiddenServicePort: 443
  image:
    repository: osminogin/tor-simple
    tag: 0.4.8.21
    hash: 169c83b402723ec5897640af107f98e9627456ec0305c96978668c5a97ff1a45
    pullPolicy: Always

  storageClassName: ""
  volumes:
    data:
      size: 1Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 512Mi

  # Probes are opt-in; tor has no HTTP/health endpoint and may lack pgrep.
  probes:
    startup:
      enabled: false
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
    liveness:
      enabled: false
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3

dnsSeeder:
  enabled: false
  name: dns-seeder
  # HA: run >=2 across zones behind the LB. Stateless, so pods are interchangeable.
  replicas: 1
  # PDB only renders when replicas > 1. minAvailable must stay < replicas or it
  # blocks all voluntary drains (Autopilot node upgrades).
  pdb:
    minAvailable: 1
  topologySpread:
    enabled: true
    whenUnsatisfiable: ScheduleAnyway
  image:
    repository: zfnd/dnsseeder
    tag: v1.6.1
    hash: 11abd347213888a2090b802ccf150237490c26167376166ffa077513d24f1216
    pullPolicy: IfNotPresent
  # Servable peers per zone required for /ready (ZEEDER__HEALTH__READY_THRESHOLD).
  # zeeder's own default is 1, which lets a pod with a SINGLE servable peer stay in the
  # LB and answer queries with one record. Raise it so a starved pod leaves rotation.
  # CAUTION: a pod that can never reach the threshold stays NotReady forever, and a
  # NotReady pod BLOCKS all further StatefulSet rollouts.
  readyThreshold: 1
  # Never co-schedule with a P2P full node. zebra/zakura can exhaust a node's ephemeral
  # ports (zakura's iroh/QUIC stack logs EADDRNOTAVAIL "Cannot assign requested
  # address"), which starves the seeder's crawler: every initial handshake fails and it
  # ends up serving 1-2 records with no way to recover short of a restart.
  # NOTE: GKE Autopilot REFUSES pod anti-affinity when the CPU request is under 500m,
  # and enforces >=1:1 GiB per vCPU, so on Autopilot also raise resources.requests to
  # cpu 500m / memory 512Mi. Leave disabled on single-tenant metal.
  antiAffinity:
    enabled: false
    apps: [zakura, zebra, zaino]
    # Namespaces to match those apps in. Empty = this release's namespace only.
    namespaces: []
    topologyKey: kubernetes.io/hostname
  dns:
    # Container listens here (unprivileged); the Service maps :53 -> this.
    listenPort: 1053
  # Persistent peer cache (StatefulSet volumeClaimTemplate) so pods restart warm.
  # The cache is tiny (<20Mi) but GKE PD minimums round up; size is configurable.
  storageClassName: ""
  volumes:
    cache:
      size: 1Gi
  zones:
    mainnet:
      enabled: true
      domain: seeder.zec.rocks
      # NOTE: nameserver must be OUTSIDE its own zone domain.
      nameserver: ns-seeder.zec.rocks
      ttl: 600
    testnet:
      enabled: true
      domain: seeder.testnet.zec.rocks
      nameserver: ns-seeder.zec.rocks
      ttl: 300
  # Per-IP rate limiting. NOTE: the required Cluster-policy LB SNATs every query
  # to a node IP, so zeeder sees a handful of node IPs, not real clients - per-IP
  # limiting then only throttles aggregated traffic and protects nothing. Set
  # effectively unlimited. zeeder has no disable env (0 is rejected, must be nonzero).
  rateLimit:
    queriesPerSecond: 100000
    burstSize: 100000
  service:
    type: LoadBalancer
    port: 53
    # One mixed TCP+UDP Service. Set false to split into two Services that share
    # loadBalancerIP (for clouds that reject a mixed-protocol LB).
    singleMixedService: true
    # Reserve a static IP on GKE; leave "" on k3s (klipper assigns the node IP).
    loadBalancerIP: ""
    # NOTE: must be Cluster. Local breaks the external UDP path through the GKE
    # target-pool LB (TCP works, UDP gets no reply -> non-Cloudflare resolvers
    # SERVFAIL). Tradeoff: client IP is SNATed so zeeder rate-limits per node IP.
    externalTrafficPolicy: Cluster
    # GKE mixed TCP+UDP: cloud.google.com/l4-rbs: "enabled"
    annotations: {}
  # Extra ZEEDER__* overrides, e.g. ZEEDER__RATE_LIMIT__ENABLED: "true".
  env: {}
  # zeeder idles tiny but the ops docs cite 100-200Mi under real load + full peer
  # sets. Request >= steady-state so QoS is stable; limit gives OOM headroom. No CPU
  # limit (burstable). cpu:mem request ratio stays under Autopilot's 6.5 GiB/vCPU.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  probes:
    startup:
      enabled: true
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 30
    readiness:
      enabled: true
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
    liveness:
      enabled: true
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1

zecd:
  enabled: false
  name: zecd
  # In-cluster service name of the node backend to dial. The RPC port follows the network
  # of whichever node component is enabled (8232 mainnet / 18232 testnet).
  rpcService: zebra
  # Wallet name created by `zecd init`; its dir is <datadir>/<defaultWallet>.
  defaultWallet: default
  image:
    repository: ghcr.io/zecrocks/zecd
    tag: "0.6.0"
    hash: 095ab98e72e9ddb2a1b9f88e718d37fa87f2980cf36e42adb3dd136bb8d39318
    pullPolicy: IfNotPresent

  replicas: 1
  podManagementPolicy: Parallel
  minReadySeconds: 15
  pdb:
    minAvailable: 1
  topologySpread:
    enabled: true
    whenUnsatisfiable: ScheduleAnyway

  nodeSelector: {}

  storageClassName: ""
  volumes:
    data:
      # Light client: wallet DB + identity only, no chain index.
      size: 10Gi

  service:
    type: ClusterIP
    port: 8232

  backend:
    connectTimeoutSecs: 10
    reconnectBaseSecs: 1
    reconnectMaxSecs: 60

  # zecd's own RPC auth (clients authenticate TO zecd). NOT the backend creds.
  rpc:
    user: zec
    # Dev-only fallback; lands in the ConfigMap. For real deploys set passwordSecret instead
    # (sourced via ZECD_RPC_PASSWORD env) and leave this as the placeholder.
    password: CHANGE-ME
    # Secret holding the RPC password (spend-equivalent for clients). When set, it is injected
    # as ZECD_RPC_PASSWORD and the inline password above is omitted from the ConfigMap.
    passwordSecret:
      name: ""
      key: rpc-password

  # Wallet key material. Create the wallet locally with `zecd init` and ship ONLY the encrypted
  # keys.toml as a Secret; the PVC is a disposable cache (zecd rebuilds data.sqlite from
  # keys.toml via bootstrap_from_keys).
  keys:
    bootstrapFromKeys: true
    # Secret holding the encrypted `keys.toml` (the seed). When set, an init container copies
    # it onto the volume at 0600 and zecd reads it from there, because bootstrap rewrites the
    # file and a Secret mount is read-only. An existing copy is never overwritten. Empty =
    # keys.toml is expected to already live on the volume under the wallet dir.
    keysSecret:
      name: ""
      key: keys.toml
    # FAST PATH ONLY. Secret holding the age identity (spend authority) for unattended
    # auto-unlock; mounted read-only at /keys/identity.txt. Leave empty for the SECURE
    # (recommended) path: the wallet is passphrase-encrypted, stays locked, and clients
    # unlock per-session with walletpassphrase - no spend authority ever lives in-cluster.
    identitySecret:
      name: ""
      key: identity.txt

  # Receiving pools and transparent (t-address) support.
  #
  # NOTE ON IRONWOOD: Ironwood (NU6.3) is NOT a pool value here. Upstream models it as
  # Orchard "V3" notes, reusing Orchard keys and addresses, so ironwood funds arrive at
  # ordinary Orchard addresses. Listing "orchard" covers them; "ironwood" is rejected.
  pools:
    # Shielded pools the wallet receives into: sapling and/or orchard.
    enabled: [orchard]
    # Subset of the above used for a new address's receivers. Empty = same as enabled.
    defaultReceivers: []

    # Transparent is an ADDITIVE opt-in, not a member of `enabled` above. A wallet can be
    # orchard-only plus transparent, sapling+orchard plus transparent, and so on.
    transparent: false
    # Make a bare t-address the no-argument getnewaddress default (implies transparent).
    transparentDefault: false

    # RECOVERY WINDOW. Consecutive unfunded transparent indices still discovered when
    # restoring from seed. Shielded funds restore unconditionally; transparent funds only
    # restore if their index falls inside this window.
    #
    # IMPORTANT INTERACTION: pre-exposure marks every index below transparentInitialScan
    # as exposed, but the window's start only advances when an address is FUNDED. So with
    # a non-zero initial scan and nothing funded near the top, the wallet reports zero
    # in-window slots and warns on every startup unless this value EXCEEDS
    # transparentInitialScan. Raising the initial scan does not help, it makes the gap
    # deeper. Either set this above the initial scan, or accept the warning and rely on
    # the floor (indices below the initial scan are still recoverable).
    transparentGapLimit: 20
    # Pre-expose and scan indices 0..N at startup so a stateless restore rediscovers a
    # payment to any of them, independent of (and usually far larger than) the gap limit.
    # Use this when many addresses are handed out. 0 = discovery is bounded by
    # transparentGapLimit alone. Costs startup time on a COLD wallet only: roughly
    # 400 addr/s (62000 took about 2.5 min), it resumes rather than restarting when
    # raised, and an unchanged restart skips it in about a second.
    transparentInitialScan: 0
    # true keeps issuing addresses past the recovery window with a loud warning; false
    # fails getnewaddress with an actionable error instead. Funds received beyond the
    # window may be unrecoverable from the seed.
    transparentAllowBeyondRecoveryWindow: true
    # Warn when fewer than this many in-window slots remain. 0 = warn only at exhaustion.
    # NOTE: zecd uses deny_unknown_fields, so only keys the RUNNING build knows may be
    # emitted here. Keep this set aligned with the released image, not with a newer
    # source checkout, or the daemon refuses to start.
    transparentGapWarnThreshold: 0

  spend:
    # Cap on Orchard actions per transaction.
    orchardActionLimit: 250

  sync:
    intervalSecs: 20

  health:
    port: 9233

  log:
    level: info
    format: json

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

  # HTTP probes on the health port (/healthz liveness, /readyz readiness).
  probes:
    startup:
      enabled: true
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 60
    readiness:
      enabled: true
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
    liveness:
      enabled: true
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 5
      successThreshold: 1

  additionalArgs: []

# Optional hidden service exposing lightwalletd/zaino over .onion. tor keeps a root
# chown/chmod init container (hidden-service dir must be 0700) and skips fsGroup.
