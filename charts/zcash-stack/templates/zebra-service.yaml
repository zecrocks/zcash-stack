{{- if .Values.zebra.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.zebra.name }}
spec:
  type: {{ .Values.zebra.service.type }}
  # ClientIP pins each consumer to one zebra replica; set None to round-robin.
  sessionAffinity: {{ .Values.zebra.service.sessionAffinity | default "ClientIP" }}
  {{- if .Values.zebra.service.publishNotReadyAddresses }}
  publishNotReadyAddresses: true
  {{- end }}
  selector:
    app: {{ .Values.zebra.name }}
  ports:
    - port: {{ if .Values.zebra.testnet }}18232{{ else }}8232{{ end }}
      targetPort: {{ if .Values.zebra.testnet }}18232{{ else }}8232{{ end }}
      protocol: TCP
      name: rpc
{{- end }}