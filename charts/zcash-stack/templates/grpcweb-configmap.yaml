{{- if .Values.grpcweb.enabled }}
{{- $g := .Values.grpcweb }}
{{- $defHost := .Values.lightwalletd.name }}
{{- $defPort := .Values.lightwalletd.service.port }}
{{- /* routes is the general form; fall back to the single path + backend keys. */}}
{{- $routes := $g.routes | default (list (dict "path" $g.path "backend" ($g.backend | default dict))) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.grpcweb.name }}-configmap
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: main
          address:
            socket_address: { address: 0.0.0.0, port_value: 8080 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: grpcweb
                    codec_type: AUTO
                    # Never idle out a GetBlockRange stream mid-sync.
                    stream_idle_timeout: 0s
                    route_config:
                      name: local
                      virtual_hosts:
                        - name: backends
                          domains: ["*"]
                          # CORS is wide open on purpose: this is a public grpc-web
                          # endpoint for browser wallets on any origin. Do not narrow it.
                          typed_per_filter_config:
                            envoy.filters.http.cors:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                              allow_origin_string_match:
                                - safe_regex: { regex: ".*" }
                              allow_methods: "GET, POST, OPTIONS"
                              allow_headers: "content-type,x-grpc-web,x-user-agent,grpc-timeout,authorization"
                              expose_headers: "grpc-status,grpc-message"
                              max_age: "1728000"
                          routes:
                            - match: { path: "/healthz" }
                              direct_response: { status: 200, body: { inline_string: "ok" } }
                          {{- range $r := $routes }}
                          {{- $name := $r.path | trimPrefix "/" | replace "/" "-" }}
                            - match: { prefix: "{{ $r.path }}/" }
                              route:
                                cluster: {{ $name }}
                                prefix_rewrite: "/"
                                timeout: 0s
                                idle_timeout: 0s
                            - match: { path: "{{ $r.path }}" }
                              route:
                                cluster: {{ $name }}
                                prefix_rewrite: "/"
                                timeout: 0s
                          {{- end }}
                    http_filters:
                      - name: envoy.filters.http.grpc_web
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                      - name: envoy.filters.http.cors
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      {{- range $r := $routes }}
      {{- $b := $r.backend | default dict }}
      {{- $name := $r.path | trimPrefix "/" | replace "/" "-" }}
        - name: {{ $name }}
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          # Plaintext h2 to the in-cluster gRPC backend. Small flow-control windows
          # so a fast block stream backpressures the backend instead of buffering
          # in envoy memory (the 256MB default window OOMs the pod on GetBlockRange).
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options:
                  initial_stream_window_size: 1048576
                  initial_connection_window_size: 2097152
          load_assignment:
            cluster_name: {{ $name }}
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ $b.host | default $defHost }}
                          port_value: {{ $b.port | default $defPort }}
      {{- end }}
{{- end }}
